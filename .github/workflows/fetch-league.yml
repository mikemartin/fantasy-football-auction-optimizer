name: Fetch league from Sleeper

# Pulls the real league - all ten rosters, results, waivers, free agents and settings - from
# Sleeper's read-only API. The dev container's proxy blocks api.sleeper.app, so this runs here.
#
# Runs every Tuesday after waivers process (Tuesday 09:00 UTC), and on demand.
# NOTE: schedule and workflow_dispatch only arm once this file reaches the default branch.
# Until then, edit .run-fetch and push - that fires a run from this branch.
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
  push:
    branches: [claude/fantasy-auction-optimizer-o0fyp4]
    paths: [".run-fetch"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fantasy-auction-optimizer-o0fyp4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite","dplyr","tidyr","readr","purrr","tibble"))'

      - name: Fetch league
        run: Rscript scripts/00_fetch_league.R

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: league-data
          path: data/league/*.csv

      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The cached player dictionary is 5MB of NFL-wide data that rebuilds itself; it
          # stays out of the repo.
          git add -f data/league/*.csv
          git diff --cached --quiet || git commit -m "Fetch league from Sleeper [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i) - rebasing"
            git pull --rebase origin claude/fantasy-auction-optimizer-o0fyp4 || exit 1
            sleep $((i * 3))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
